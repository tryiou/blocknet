name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v4.4.1 or commit SHA). Leave empty for tag."
        required: false
        default: ""
      os_filter:
        description: "OS filter for Guix (l,w,m or lwm)"
        required: false
        default: "lwm"

permissions:
  contents: write

jobs:
  # Host list + version, resolved once so tag pushes (no inputs) and manual
  # dispatches (os_filter/version inputs) share one matrix. Splitting the
  # build into per-host jobs (instead of one all-hosts job) gives each host
  # the full runner timeout and lets a flaky host fail alone instead of
  # killing all six artifacts.
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi
          echo "Ref: ${{ github.ref_name }} / ${{ inputs.version }}"
          grep CLIENT_VERSION -m1 configure.ac || true
      - name: Resolve hosts
        id: hosts
        run: |
          FILTER="${{ inputs.os_filter }}"
          if [ -z "$FILTER" ] || [ "$FILTER" = "lwm" ]; then
            HOSTS="x86_64-linux-gnu aarch64-linux-gnu x86_64-w64-mingw32 aarch64-w64-mingw32 arm64-apple-darwin x86_64-apple-darwin"
          else
            HOSTS=""
            case "$FILTER" in *l*) HOSTS="$HOSTS x86_64-linux-gnu aarch64-linux-gnu" ;; esac
            case "$FILTER" in *w*) HOSTS="$HOSTS x86_64-w64-mingw32 aarch64-w64-mingw32" ;; esac
            case "$FILTER" in *m*) HOSTS="$HOSTS x86_64-apple-darwin arm64-apple-darwin" ;; esac
            HOSTS="$(echo $HOSTS | xargs)"
          fi
          echo "HOSTS=$HOSTS"
          JSON="[$(printf '"%s",' $HOSTS | sed 's/,$//')]"
          echo "hosts=$JSON" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # Deterministic Guix builds — ALL inside pinned Docker
  # blocknet-guix:22.04 (FROM ubuntu:22.04 + Guix 1.5.0), glibc 2.35
  # No host apt, no runner drift, no --disable-chroot.
  # ──────────────────────────────────────────────────────────────
  guix-build:
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.setup.outputs.hosts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: blocknet
          fetch-depth: 0

      - name: Build Guix image (pinned, cached)
        working-directory: blocknet
        run: DOCKER_BUILDKIT=1 docker build -f contrib/guix/Dockerfile -t blocknet-guix:22.04 .

      - name: Install macOS SDK (darwin only)
        if: contains(matrix.host, 'darwin')
        working-directory: blocknet
        run: |
          source contrib/guix/macos-sdk.env
          SDK_ARCHIVE="$RUNNER_TEMP/$MACOS_SDK_NAME.tar"
          if [ ! -d "depends/SDKs/$MACOS_SDK_NAME" ]; then
            mkdir -p depends/SDKs
            curl --location --fail "$MACOS_SDK_URL/$MACOS_SDK_NAME.tar" --output "$SDK_ARCHIVE"
            printf '%s %s\n' "$MACOS_SDK_SHA256" "$SDK_ARCHIVE" | sha256sum --check
            tar -C depends/SDKs -xf "$SDK_ARCHIVE"
          fi
          ls depends/SDKs/

      - name: Guix build ${{ matrix.host }} (inside Docker)
        working-directory: blocknet
        run: |
          set -e
          export HOSTS="${{ matrix.host }}"
          export FORCE_DIRTY_WORKTREE=1
          export JOBS="$(nproc)"
          export OUTDIR_BASE="$PWD/../blocknet-binaries"
          mkdir -p "$OUTDIR_BASE"
          set -o pipefail
          ./contrib/guix/docker-run.sh "${{ matrix.host }}" 2>&1 | tee /tmp/guix-${{ matrix.host }}.log
          EXIT=${PIPESTATUS[0]}
          echo "EXIT:$EXIT" | tee -a /tmp/guix-${{ matrix.host }}.log
          ls -R ../blocknet-binaries 2>&1 | head -n 30 || true
          find ../blocknet-binaries -type f -exec sha256sum {} \; || true
          exit $EXIT

      - name: Smoke check artifact
        working-directory: blocknet
        run: |
          ls -lh ../blocknet-binaries/${{ matrix.host }}/ 2>&1 | head -n 20 || true
          file ../blocknet-binaries/${{ matrix.host }}/* 2>&1 | head -n 20 || true
          compgen -G "../blocknet-binaries/${{ matrix.host }}/*.tar.gz" > /dev/null \
            || compgen -G "../blocknet-binaries/${{ matrix.host }}/*.zip" > /dev/null \
            || compgen -G "../blocknet-binaries/${{ matrix.host }}/*.dmg" > /dev/null \
            || compgen -G "../blocknet-binaries/${{ matrix.host }}/*.exe" > /dev/null \
            || { echo "no artifact for ${{ matrix.host }} — FAIL"; exit 1; }

      - name: Stage host artifacts
        run: |
          # One dir per host so merged downloads keep the
          # <host>/* layout the docker and release jobs expect.
          mkdir -p release-staging/${{ matrix.host }}
          cp -a blocknet-binaries/${{ matrix.host }}/. release-staging/${{ matrix.host }}/
          cp /tmp/guix-${{ matrix.host }}.log release-staging/${{ matrix.host }}/
          ls -R release-staging | head -n 20

      - name: Upload Guix artifacts (${{ matrix.host }})
        uses: actions/upload-artifact@v6
        with:
          name: blocknet-guix-${{ needs.setup.outputs.version }}-${{ matrix.host }}
          path: release-staging
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # Docker multi-arch — FROM ubuntu:22.04 (glibc 2.35 floor), not bionic/24.04
  # ──────────────────────────────────────────────────────────────
  docker:
    needs: [setup, guix-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: blocknet

      - name: Download Guix artifacts (into the build context)
        uses: actions/download-artifact@v6
        with:
          pattern: blocknet-guix-${{ needs.setup.outputs.version }}-*
          merge-multiple: true
          path: blocknet/blocknet-binaries

      - name: List binaries
        run: ls -R blocknet/blocknet-binaries 2>/dev/null || { echo "no binaries downloaded"; exit 1; }

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: blocknetdx/blocknet
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=auto

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ORG_BLOCKNETDXIMG_USERNAME }}
          password: ${{ secrets.ORG_BLOCKNETDXIMG_PASSWORD }}

      - name: Login to GHCR (fallback)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: blocknet
          file: ./blocknet/contrib/containers/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  github-release:
    needs: [setup, guix-build, docker]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: blocknet-guix-${{ needs.setup.outputs.version }}-*
          merge-multiple: true
          path: artifacts

      - name: Build SHA256SUMS
        run: |
          find artifacts -type f ! -name SHA256SUMS -exec sha256sum {} \; | sort -k2 > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Verify artifacts present
        run: |
          ls -R artifacts
          test -f artifacts/SHA256SUMS || { echo "SHA256SUMS missing"; exit 1; }
          count=$(find artifacts -name 'blocknet-*.tar.gz' -o -name 'blocknet-*.zip' -o -name 'blocknet-*.exe' -o -name 'blocknet-*.dmg' | wc -l)
          echo "artifact count: $count"
          test "$count" -gt 0 || { echo "no release artifacts found"; exit 1; }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Blocknet Core ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/blocknet-*.tar.gz
            artifacts/**/blocknet-*.zip
            artifacts/**/blocknet-*.exe
            artifacts/**/blocknet-*.dmg
            artifacts/SHA256SUMS
