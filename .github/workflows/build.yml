name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: write

env:
  BASEPREFIX: /opt/blocknetdx/blocknet/depends
  DEPENDS_CACHE: /proj/depends-cache

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      HOST: x86_64-pc-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Build in container
        run: |
          docker run --rm -v $(pwd):/work -w /work blocknetdx/devbuilds:gitlab-linux bash -c "
            rm -rf $BASEPREFIX
            cp -r $DEPENDS_CACHE $BASEPREFIX
            chmod +x ./autogen.sh
            ./autogen.sh
            CONFIG_SITE=\"$BASEPREFIX/$HOST/share/config.site\" ./configure CC=gcc-8 CXX=g++-8 CFLAGS=\"-g3 -O0\" CXXFLAGS=\"-g3 -O0\" --enable-debug --prefix=/
            ./config.status --recheck
            ./config.status
            make clean
            make -j $(nproc)
            mkdir -p /work/dist
            make install DESTDIR=/work/dist
          "

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: |
            dist/bin/blocknet-cli
            dist/bin/blocknetd
            dist/bin/blocknet-qt
            dist/bin/blocknet-tx
            dist/bin/blocknet-wallet
            dist/bin/test_blocknet
            dist/bin/test_blocknet-qt

  build-win:
    runs-on: ubuntu-latest
    env:
      HOST: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4

      - name: Build in container
        run: |
          docker run --rm -v $(pwd):/work -w /work blocknetdx/devbuilds:gitlab-win bash -c "
            rm -rf $BASEPREFIX
            cp -r $DEPENDS_CACHE $BASEPREFIX
            chmod +x ./autogen.sh
            ./autogen.sh
            CONFIG_SITE=\"$BASEPREFIX/$HOST/share/config.site\" ./configure --prefix=/ --disable-ccache --disable-maintainer-mode --disable-dependency-tracking --enable-reduce-exports --disable-bench --disable-gui-tests
            ./config.status --recheck
            ./config.status
            make clean
            make -j $(nproc)
            make deploy
            mkdir -p /work/dist
            make install DESTDIR=/work/dist
            cp *win64-setup.exe /work/dist/bin/blocknet-win64-setup.exe
          "

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-win
          path: |
            dist/bin/blocknet-cli.exe
            dist/bin/blocknetd.exe
            dist/bin/blocknet-qt.exe
            dist/bin/blocknet-tx.exe
            dist/bin/blocknet-wallet.exe
            dist/bin/test_blocknet.exe
            dist/bin/blocknet-win64-setup.exe

  build-mac:
    runs-on: ubuntu-latest
    env:
      HOST: x86_64-apple-darwin14
    steps:
      - uses: actions/checkout@v4

      - name: Build in container
        run: |
          docker run --rm -v $(pwd):/work -w /work blocknetdx/devbuilds:gitlab-mac bash -c "
            rm -rf $BASEPREFIX
            cp -r $DEPENDS_CACHE $BASEPREFIX
            chmod +x ./autogen.sh
            ./autogen.sh
            CONFIG_SITE=\"$BASEPREFIX/$HOST/share/config.site\" ./configure CFLAGS=\"-g3 -O0\" CXXFLAGS=\"-g3 -O0\" --with-gui=qt5 --enable-debug --prefix=/
            ./config.status --recheck
            ./config.status
            make clean
            make -j $(nproc)
            mkdir -p /work/dist/bin
            llvm-dsymutil-6.0 src/qt/blocknet-qt -o /work/dist/bin/blocknet-qt.dSYM
            make install DESTDIR=/work/dist
          "

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-mac
          path: |
            dist/bin/blocknet-cli
            dist/bin/blocknetd
            dist/bin/blocknet-qt
            dist/bin/blocknet-qt.dSYM
            dist/bin/blocknet-tx
            dist/bin/blocknet-wallet
            dist/bin/test_blocknet
            dist/bin/test_blocknet-qt
