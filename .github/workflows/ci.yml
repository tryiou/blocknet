name: CI

on:
  push:
    branches: [master, dev, "feat/*", "fix/*"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Linux x64 — ubuntu-22.04  / HOST x86_64-pc-linux-gnu (jammy for compat, local 24.04)
  # Linux arm64 — ubuntu-24.04-arm / HOST aarch64-linux-gnu
  # ──────────────────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      HOST: x86_64-pc-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            python3 curl ca-certificates ccache git cmake \
            libevent-dev libboost-system-dev libboost-filesystem-dev libboost-chrono-dev \
            libboost-test-dev libboost-thread-dev libdb++-dev libminiupnpc-dev libzmq3-dev \
            libqt5gui5 libqt5core5a libqt5dbus5 qttools5-dev qttools5-dev-tools libprotobuf-dev protobuf-compiler \
            libqrencode-dev bison
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/work/download
            depends/sources
            depends/x86_64-pc-linux-gnu
          key: depends-linux-x64-${{ hashFiles('depends/**', 'configure.ac') }}-v1
          restore-keys: depends-linux-x64-
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-linux-x64-${{ github.sha }}
          restore-keys: ccache-linux-x64-
      - name: Build depends
        run: make -C depends HOST=$HOST -j$(nproc)
      - name: Build
        run: |
          ccache -s || true
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/$HOST/share/config.site ./configure --prefix=/ --enable-reduce-exports --enable-glibc-back-compat || (cat config.log; exit 1)
          make -j$(nproc)
          ccache -s || true
      - name: Check
        run: make check -j$(nproc) || (cat src/test/test_suite.log 2>/dev/null; cat src/test/*.log 2>/dev/null; exit 1)
      - name: Gather binaries
        run: |
          mkdir -p dist/bin
          make install DESTDIR=$PWD/dist
          ls -lh dist/bin/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: blocknet-linux-x64
          path: |
            dist/bin/blocknetd
            dist/bin/blocknet-cli
            dist/bin/blocknet-tx
            dist/bin/blocknet-wallet
            dist/bin/blocknet-qt
            dist/bin/test_blocknet
          if-no-files-found: warn
          retention-days: 7

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      HOST: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libtool autotools-dev automake pkg-config bsdmainutils \
            python3 curl ca-certificates ccache git cmake \
            g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/work/download
            depends/sources
            depends/aarch64-linux-gnu
          key: depends-linux-arm64-${{ hashFiles('depends/**', 'configure.ac') }}-v1
          restore-keys: depends-linux-arm64-
      - name: Build depends
        run: make -C depends HOST=$HOST -j$(nproc)
      - name: Build
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/$HOST/share/config.site ./configure --prefix=/ --enable-reduce-exports --enable-glibc-back-compat || (cat config.log; exit 1)
          make -j$(nproc)
      - name: Check
        run: make check -j$(nproc) || true
      - name: Gather
        run: |
          mkdir -p dist/bin
          make install DESTDIR=$PWD/dist
      - uses: actions/upload-artifact@v4
        with:
          name: blocknet-linux-arm64
          path: dist/bin/*
          if-no-files-found: warn
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Windows — cross-built on Linux was old Gitian/depends model.
  # New CI: native sanity on Windows runners (MSYS2 + depends mingw).
  # Keep cross-build as canonical in release (Guix). Windows native here is
  # best-effort sanity, allowed to fail until mingw-arm64 qt spec lands.
  # ──────────────────────────────────────────────────────────────
  build-win-x64:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      HOST: x86_64-w64-mingw32
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-tools
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-zeromq
            make
            autoconf
            automake
            libtool
            pkg-config
            git
      - name: Cache depends (mingw)
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/work
            depends/x86_64-w64-mingw32
          key: depends-win-x64-${{ hashFiles('depends/**') }}-v1
          restore-keys: depends-win-x64-
      - name: Build depends (mingw)
        shell: msys2 {0}
        run: make -C depends HOST=$HOST -j$(nproc) || make -C depends HOST=$HOST -j1 V=1
      - name: Build
        shell: msys2 {0}
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/$HOST/share/config.site ./configure --prefix=/ --disable-ccache --disable-maintainer-mode --disable-dependency-tracking --enable-reduce-exports --disable-bench --disable-gui-tests || (cat config.log; exit 1)
          make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: blocknet-win-x64
          path: |
            src/blocknetd.exe
            src/qt/blocknet-qt.exe
            src/blocknet-cli.exe
            src/blocknet-tx.exe
          if-no-files-found: warn
          retention-days: 7

  build-win-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 180
    continue-on-error: true   # experimental — aarch64 mingw qt spec not yet upstream
    env:
      HOST: aarch64-w64-mingw32
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            mingw-w64-clang-aarch64-gcc
            make
            autoconf
            automake
            libtool
            pkg-config
            git
      - name: Build depends (aarch64 mingw — experimental)
        shell: msys2 {0}
        run: |
          echo "Attempting aarch64-w64-mingw32 depends (expected to need qt.mk arm64 patch)"
          make -C depends HOST=$HOST -j$(nproc) NO_UPNP=1 || echo "::warning::aarch64 mingw depends failed — see depends/hosts/mingw32.mk"
      - name: Build (if depends succeeded)
        shell: msys2 {0}
        run: |
          if [ -f depends/$HOST/share/config.site ]; then
            ./autogen.sh
            CONFIG_SITE=$PWD/depends/$HOST/share/config.site ./configure --prefix=/ --disable-gui --disable-tests --disable-bench || (cat config.log; exit 0)
            make -j$(nproc) || true
          else
            echo "Skipping build — depends not ready for aarch64 mingw yet"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blocknet-win-arm64-experimental
          path: src/*.exe
          if-no-files-found: warn
          retention-days: 3

  # ──────────────────────────────────────────────────────────────
  # macOS — native on macos-15 (arm64) and macos-15-intel (x64)
  # Deterministic cross via Guix remains canonical; these are CI sanity.
  # ──────────────────────────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      HOST: arm64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          brew update || true
          brew install automake libtool pkg-config gnu-getopt || true
          # SDK is provided by Xcode — no need to download MacOSX10.11.sdk.tar.gz anymore
          xcode-select -p || true
          xcrun --show-sdk-path || true
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/work
            depends/arm64-apple-darwin
            depends/SDKs
          key: depends-macos-arm64-${{ hashFiles('depends/**') }}-v1
          restore-keys: depends-macos-arm64-
      - name: Build depends (native arm64)
        run: |
          # For native macOS we use the build-triple, Guix cross is separate.
          # Attempt depends with native host first; if that fails, fall back to no-depends system libs.
          make -C depends HOST=$HOST -j$(sysctl -n hw.ncpu) || echo "::warning::depends arm64-apple-darwin failed — will try system libs"
      - name: Build
        run: |
          ./autogen.sh
          if [ -f depends/$HOST/share/config.site ]; then
            CONFIG_SITE=$PWD/depends/$HOST/share/config.site ./configure --prefix=/ --with-gui=qt5 --disable-bench || (cat config.log; exit 1)
          else
            ./configure --prefix=/ --with-gui --disable-bench || (cat config.log; exit 1)
          fi
          make -j$(sysctl -n hw.ncpu)
      - uses: actions/upload-artifact@v4
        with:
          name: blocknet-macos-arm64
          path: |
            src/blocknetd
            src/qt/blocknet-qt
            src/blocknet-cli
          if-no-files-found: warn
          retention-days: 7

  build-macos-x64:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      HOST: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          brew update || true
          brew install automake libtool pkg-config || true
          xcrun --show-sdk-path || true
      - name: Cache depends
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/work
            depends/x86_64-apple-darwin
          key: depends-macos-x64-${{ hashFiles('depends/**') }}-v1
          restore-keys: depends-macos-x64-
      - name: Build depends
        run: make -C depends HOST=$HOST -j$(sysctl -n hw.ncpu) || echo "::warning::depends x86_64-apple-darwin failed"
      - name: Build
        run: |
          ./autogen.sh
          if [ -f depends/$HOST/share/config.site ]; then
            CONFIG_SITE=$PWD/depends/$HOST/share/config.site ./configure --prefix=/ --with-gui=qt5 --disable-bench || (cat config.log; exit 1)
          else
            ./configure --prefix=/ --with-gui --disable-bench || (cat config.log; exit 1)
          fi
          make -j$(sysctl -n hw.ncpu)
      - uses: actions/upload-artifact@v4
        with:
          name: blocknet-macos-x64
          path: |
            src/blocknetd
            src/qt/blocknet-qt
            src/blocknet-cli
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck & yaml lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck yamllint
          yamllint .github/workflows/ || true
          shellcheck contrib/*.sh contrib/**/*.sh 2>/dev/null || true
